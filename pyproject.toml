[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textprep-bench"
version = "0.1.0"
description = "Reproducible ablation benchmark of text-preprocessing choices for social-media text classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3",
  "scipy>=1.10", "matplotlib>=3.7", "joblib>=1.3",
]

[project.optional-dependencies]
porter = ["nltk>=3.8"]
dev = ["pytest>=7"]

[project.scripts]
textprep-bench = "textprep_bench.cli:main"

[tool.setuptools.packages.find]
include = ["textprep_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
